<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="skinFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="dressFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGradFemale)"/>
  
  <!-- Long Hair (Back) -->
  <path d="M38 52 C36 82 40 102 46 112 C48 100 46 80 46 68 Z" fill="#312e81"/>
  <path d="M90 52 C92 82 88 102 82 112 C80 100 82 80 82 68 Z" fill="#312e81"/>

  <!-- Shoulders & Dress -->
  <path d="M26 128 C26 96 42 86 64 86 C86 86 102 96 102 128 Z" fill="url(#dressFemale)"/>
  <!-- Dress V-neck -->
  <polygon points="64,98 56,86 72,86" fill="url(#skinFemale)"/>

  <!-- Neck -->
  <rect x="57" y="70" width="14" height="18" rx="4" fill="url(#skinFemale)"/>
  
  <!-- Head & Face -->
  <ellipse cx="64" cy="53" rx="19" ry="23" fill="url(#skinFemale)"/>
  
  <!-- Earrings -->
  <circle cx="43" cy="57" r="3" fill="#f59e0b"/>
  <circle cx="85" cy="57" r="3" fill="#f59e0b"/>

  <!-- Female Hair (Front & Top) -->
  <path d="M42 50 C40 32 48 22 64 22 C80 22 88 32 86 50 C80 34 76 30 64 30 C52 30 48 34 42 50 Z" fill="#312e81"/>
  <path d="M42 46 C45 36 54 32 64 32 C58 35 52 42 48 50 Z" fill="#3730a3"/>

  <!-- Eyes & Lashes -->
  <circle cx="56" cy="52" r="2.5" fill="#1e293b"/>
  <circle cx="72" cy="52" r="2.5" fill="#1e293b"/>
  <path d="M53 49 L51 47" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M75 49 L77 47" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M52 47 Q56 44 60 47" stroke="#312e81" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M68 47 Q72 44 76 47" stroke="#312e81" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Smile with soft lips -->
  <path d="M58 64 Q64 69 70 64" stroke="#db2777" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
